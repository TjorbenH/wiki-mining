services:
  # DISPATCHER
  # analyse the existing db and add new urls to crawl to the queue 
  dispatcher:
    build: ./dispatcher
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_healthy
    environment:
      # db environment variables
      DB_HOST: ${DB_HOST}                   
      DB_PORT: ${DB_PORT}                 
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # queue environment variables
      REDIS_HOST: ${REDIS_HOST}
      REDIS_CRAWL_STREAM: ${REDIS_CRAWL_STREAM}
      REDIS_CRAWL_GROUP: ${REDIS_CRAWL_GROUP}
      REDIS_DISPATCHER_STREAM: ${REDIS_DISPATCHER_STREAM}
      REDIS_DISPATCHER_GROUP: ${REDIS_DISPATCHER_GROUP}
      # tunables
      LOG_LEVEL: ${LOG_LEVEL}
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT}
      # reclaim tunables
      RECLAIM_RETRY_MAX_ATTEMPTS: ${RECLAIM_RETRY_MAX_ATTEMPTS}


  # CRAWLER
  # does the actual crawling and scraping
  crawler:
    build: ./crawler
    # does not start automatically on a 'docker compose up -d'
    # start seperately via 'docker compose up -d crawler' once any whitelist and seed settings are complete (see seed.py)
    profiles: ["crawler"]
    depends_on:
      queue:
        condition: service_healthy
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # db environment variables
      DB_HOST: ${DB_HOST}                   
      DB_PORT: ${DB_PORT}                 
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # queue environment variables
      REDIS_HOST: ${REDIS_HOST}
      REDIS_CRAWL_STREAM: ${REDIS_CRAWL_STREAM}
      REDIS_CRAWL_GROUP: ${REDIS_CRAWL_GROUP}
      REDIS_DISPATCHER_STREAM: ${REDIS_DISPATCHER_STREAM}
      REDIS_DISPATCHER_GROUP: ${REDIS_DISPATCHER_GROUP}
      # MiniIO environment variables 
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      # tunables
      CONCURRENCY_LIMIT: ${CONCURRENCY_LIMIT}
      RATE_LIMIT: ${RATE_LIMIT}
      LOG_LEVEL: ${LOG_LEVEL}
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT}
    
  # MONITOR
  # exposes a read-only monitoring web interface to check up on scraping stats and progress
  monitor:
    build: ./monitor
    restart: always
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_healthy
    ports:
      # same port on host and in the container; localhost only, it has no authentication
      - "127.0.0.1:${MONITOR_PORT:-5000}:${MONITOR_PORT:-5000}"
    environment:
      # db environment variables (read-only role)
      DB_HOST: ${DB_HOST}                   
      DB_PORT: ${DB_PORT}                 
      DB_NAME: ${DB_NAME}
      DB_USER: ${MONITOR_DB_USER}
      DB_PASSWORD: ${MONITOR_DB_PASSWORD}
      # queue environment variables
      REDIS_HOST: ${REDIS_HOST}
      REDIS_CRAWL_STREAM: ${REDIS_CRAWL_STREAM}
      REDIS_CRAWL_GROUP: ${REDIS_CRAWL_GROUP}
      REDIS_DISPATCHER_STREAM: ${REDIS_DISPATCHER_STREAM}
      REDIS_DISPATCHER_GROUP: ${REDIS_DISPATCHER_GROUP}
      # tunables
      LOG_LEVEL: ${LOG_LEVEL}
      # needed for crawl completion detection
      RECLAIM_RETRY_MAX_ATTEMPTS: ${RECLAIM_RETRY_MAX_ATTEMPTS}
      # port the web interface listens on; also used by the ports mapping and healthcheck of this service
      MONITOR_PORT: ${MONITOR_PORT:-5000}
    healthcheck:
      # python:slim has no curl; urlopen raises (non-zero exit) on connection errors and non-2xx
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${MONITOR_PORT:-5000}/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
  

  # MESSAGE QUEUE
  # coordinate and synchonize the crawlers on a set of urls
  queue:
    image: redis:8.6.2
    restart: always
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - queue-data:/data

  # DATABASE:
  # Postgres database to save the scraped data and metadata
  db:
    image: postgres:16
    restart: always
    environment:
      # admin role
      POSTGRES_DB: ${DB_NAME}              
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # read-only role for the monitor
      MONITOR_DB_USER: ${MONITOR_DB_USER}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - db-data:/var/lib/postgresql/data/
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:z # REMOVE BEFORE FLIGHT :z is just for Fedora 
      - ./monitor-role.sh:/docker-entrypoint-initdb.d/monitor-role.sh:z # REMOVE BEFORE FLIGHT :z is just for Fedora 

  # ADMINER
  # admin interface into the postgress database
  adminer:
    image: adminer:5.4.2
    restart: always
    ports:
      - 8080:8080
    environment:
      POSTGRES_DB: ${DB_NAME}              
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
  
  # MINIO 
  # Object Storage for the large amounts of HTML Data expected
  minio:
    # minio/minio was removed from Docker Hub
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" # API Port 
      - "9001:9001" # Web-Interface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio-data:/data

  # MINIO SETUP
  minio-setup:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb myminio/${MINIO_BUCKET} || true;
      exit 0;
      "

# PERSISTENT STORAGE
volumes:
  db-data:
  queue-data:
  minio-data:

